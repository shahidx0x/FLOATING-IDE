name: Build FLIDE for Windows

# Builds FLIDE (VS Code fork) for Windows x64:
#   - FLIDE-Setup-x64-<version>.exe   installer (per-user, no admin needed)
#   - FLIDE-win32-x64-<version>.zip   portable folder with FLIDE.exe
# Every push to main  -> files under "Artifacts" on the run page.
# Every tag v*        -> files attached to a GitHub Release as well.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      VSCODE_ARCH: x64
      npm_config_arch: x64
      # avoids GitHub API rate limits when the build downloads Electron, ripgrep and built-in extensions
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up Python (for native modules)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Put signtool on PATH (Windows SDK)
        shell: pwsh
        run: |
          $st = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -like '*\x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if ($st) {
            $st.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            "signtool: $($st.FullName)"
          } else {
            'signtool not found; the build will skip signature stripping'
          }

      - name: Build FLIDE (x64, minified)
        run: npm run gulp vscode-win32-x64-min

      - name: Add the updater used by the installer
        run: npm run gulp vscode-win32-x64-inno-updater

      - name: Build the installer (user setup)
        run: npm run gulp vscode-win32-x64-user-setup

      - name: Collect the exe and the portable zip
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist | Out-Null

          $setup = Get-ChildItem .build\win32-x64 -Recurse -Filter *.exe | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $setup) { throw 'Installer exe not found under .build\win32-x64' }
          Copy-Item $setup.FullName "dist\FLIDE-Setup-x64-$version.exe"

          $app = Resolve-Path ..\VSCode-win32-x64
          if (-not (Test-Path "$app\FLIDE.exe")) { throw "FLIDE.exe not found in $app" }
          7z a -tzip "dist\FLIDE-win32-x64-$version.zip" "$app\*" | Out-Null

          Get-ChildItem dist | Format-Table Name, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FLIDE-windows-x64
          path: dist/*
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
